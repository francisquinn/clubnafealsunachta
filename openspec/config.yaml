schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  Club na Fealsúnachta (CNF) website — personal side project, a philosophy
  discussion club run in Trieste.
  Stack: Astro + React (islands), Supabase (Postgres DB + custom session-token
  auth, no third-party auth provider), Mailchimp (newsletter), deployed on
  Netlify. Testing via Vitest.
  Schema changes go through real Supabase migrations under
  supabase/migrations/ (supabase db push) — never hand-edit schema.sql.
  Commit convention: Conventional Commits prefixes (feat:/fix:/chore:), short
  bodies, one squashed commit per PR, "close #N" in the message.
  Any admin-gated server action must re-check admin status live via
  requireAdmin()/isMemberAdmin() (src/lib/auth.ts) — never trust a token
  claim alone for gating, only for cheap non-gating UI reads.

